<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Growbox Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2/dist/chartjs-plugin-zoom.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --gridline: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --series-1: #2a78d6;
    --series-2: #008300;
    --series-3: #e87ba4;
    --series-4: #eda100;
    --series-5: #1baf7a;
    --series-6: #eb6834;
    --series-7: #4a3aa7;
    --series-8: #e34948;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface-1: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --gridline: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --good: #0ca30c;
      --warning: #fab219;
      --serious: #ec835a;
      --critical: #d03b3b;
      --series-1: #3987e5;
      --series-2: #008300;
      --series-3: #d55181;
      --series-4: #c98500;
      --series-5: #199e70;
      --series-6: #d95926;
      --series-7: #9085e9;
      --series-8: #e66767;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
    padding: 16px;
  }
  h1, h2, h3 { margin: 0; font-weight: 600; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
  }
  .topbar h1 { font-size: 1.4rem; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.8rem; color: var(--text-secondary);
    padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border);
  }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--critical); }
  .status-dot.online { background: var(--good); }

  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin-bottom: 16px;
  }
  .card h2 { font-size: 1rem; margin-bottom: 14px; }

  .grid { display: grid; gap: 16px; }
  .grid-stats { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .grid-charts { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .grid-actuators { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .grid-two { grid-template-columns: 1fr 1fr; }
  @media (max-width: 700px) { .grid-two { grid-template-columns: 1fr; } }

  .stat-tile { }
  .stat-tile .label { font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 4px; }
  .stat-tile .value { font-size: 1.6rem; font-weight: 600; }
  .stat-tile .unit { font-size: 0.9rem; color: var(--text-muted); font-weight: 400; }
  .stat-tile .badge {
    display: inline-block; margin-top: 6px; font-size: 0.72rem; padding: 2px 8px;
    border-radius: 999px; font-weight: 600;
  }
  .badge-good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
  .badge-warning { background: color-mix(in srgb, var(--warning) 22%, transparent); color: #8a5a00; }
  .badge-critical { background: color-mix(in srgb, var(--critical) 16%, transparent); color: var(--critical); }
  .badge-muted { background: color-mix(in srgb, var(--text-muted) 16%, transparent); color: var(--text-muted); }
  @media (prefers-color-scheme: dark) {
    .badge-warning { color: var(--warning); }
  }

  .chart-box { position: relative; height: 220px; }
  .chart-box canvas { width: 100% !important; height: 100% !important; }
  .chart-title { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 8px; }

  button {
    font-family: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px;
    background: var(--surface-1); color: var(--text-primary);
  }
  button:hover { background: var(--gridline); }
  button.primary { background: var(--series-1); color: white; border-color: var(--series-1); }
  button.danger { background: var(--critical); color: white; border-color: var(--critical); }
  button.small { padding: 5px 10px; font-size: 0.75rem; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  input[type=range] { width: 100%; }
  input[type=text], input[type=number] {
    font-family: inherit; padding: 7px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--page); color: var(--text-primary);
    width: 100%;
  }
  label { font-size: 0.78rem; color: var(--text-secondary); display: block; margin-bottom: 4px; }

  .actuator-card { background: var(--page); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .actuator-card .value-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .actuator-card .value-row .value { font-size: 1.3rem; font-weight: 600; }

  .weekday-picker { display: flex; gap: 4px; margin: 6px 0; flex-wrap: wrap; }
  .weekday-picker button { padding: 6px 10px; font-size: 0.75rem; }
  .weekday-picker button.active { background: var(--series-1); color: white; border-color: var(--series-1); }

  .schedule-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; border-radius: 8px; background: var(--page);
    border: 1px solid var(--border); margin-bottom: 8px; gap: 10px; flex-wrap: wrap;
  }
  .schedule-item.disabled { opacity: 0.5; }
  .schedule-item .meta { font-size: 0.78rem; color: var(--text-secondary); }
  .action-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .action-row select { flex: 1; padding: 6px; border-radius: 6px; border: 1px solid var(--border); background: var(--page); color: var(--text-primary); }
  .action-row input[type=number] { width: 90px; }

  .status-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .status-table td { padding: 5px 0; border-bottom: 1px solid var(--gridline); }
  .status-table td:last-child { text-align: right; color: var(--text-secondary); }

  #toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--text-primary); color: var(--surface-1);
    padding: 10px 18px; border-radius: 8px; font-size: 0.85rem;
    opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  #toast.show { opacity: 0.95; }
</style>
</head>
<body>

<div class="topbar">
  <h1>Growbox Dashboard</h1>
  <div class="status-pill"><span class="status-dot" id="connDot"></span><span id="connText">Verbinde...</span></div>
</div>

<div class="card">
  <h2>Sensoren</h2>
  <div class="grid grid-stats" id="statTiles"></div>
</div>

<div class="card">
  <h2>Verlauf</h2>
  <div class="grid grid-charts" id="chartGrid"></div>
</div>

<div class="card">
  <h2>Aktoren</h2>
  <div class="grid grid-actuators" id="actuatorCards"></div>
</div>

<div class="card">
  <h2>Zeitplan</h2>
  <div class="grid grid-two">
    <div>
      <label>Name</label>
      <input type="text" id="ruleName" placeholder="z.B. Nachtabsenkung">
      <div class="grid grid-two" style="margin-top:10px;">
        <div>
          <label>Start</label>
          <input type="text" id="ruleStart" value="08:00">
        </div>
        <div>
          <label>Ende</label>
          <input type="text" id="ruleEnd" value="20:00">
        </div>
      </div>
      <label style="margin-top:10px;">Wochentage</label>
      <div class="weekday-picker" id="weekdayPicker"></div>
      <div class="btn-row">
        <button class="small" onclick="selectWeekdays([0,1,2,3,4,5,6])">Alle</button>
        <button class="small" onclick="selectWeekdays([0,1,2,3,4])">Mo-Fr</button>
        <button class="small" onclick="selectWeekdays([5,6])">Sa-So</button>
        <button class="small" onclick="selectWeekdays([])">Keine</button>
      </div>
    </div>
    <div>
      <label>Aktionen</label>
      <div id="ruleActions"></div>
      <button class="small" onclick="addActionRow()">+ Aktion hinzufuegen</button>
      <div class="btn-row">
        <button class="primary" onclick="submitRule()">Regel speichern</button>
      </div>
    </div>
  </div>
  <div style="margin-top:18px;" id="scheduleList"></div>
  <div class="btn-row">
    <button class="danger small" onclick="clearAllSchedules()">Alle Regeln loeschen</button>
  </div>
</div>

<div class="grid grid-two">
  <div class="card">
    <h2>System</h2>
    <table class="status-table" id="statusTable"></table>
    <div class="btn-row">
      <button onclick="downloadCsv()">CSV herunterladen</button>
      <button class="danger" onclick="resetDevice()">Neustart</button>
    </div>
  </div>
  <div class="card">
    <h2>Firmware-Update</h2>
    <div id="otaStatus" class="stat-tile">
      <div class="label">Version</div>
      <div class="value" id="otaVersion">-</div>
    </div>
    <div class="btn-row">
      <button onclick="checkOta()">Nach Updates suchen</button>
      <button class="primary" id="otaApplyBtn" style="display:none;" onclick="applyOta()">Jetzt aktualisieren</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

const SERIES_COLORS = ['--series-1','--series-2','--series-3','--series-4','--series-5','--series-6','--series-7','--series-8'];
function seriesColor(i) {
  return getComputedStyle(document.documentElement).getPropertyValue(SERIES_COLORS[i % SERIES_COLORS.length]).trim();
}
function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = String(str ?? '');
  return div.innerHTML;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  if (res.status === 401) {
    showToast('Login erforderlich - Seite neu laden');
    throw new Error('unauthorized');
  }
  return res.json();
}

// ---- Sensor definitions: how each raw field is displayed (unit, decimals, status) ----
const SENSOR_FIELD_DEFS = {
  'bme680_indoor.temp':      { label: 'Temperatur (innen)', unit: '°C', decimals: 1 },
  'bme680_indoor.humidity':  { label: 'Luftfeuchte (innen)', unit: '%', decimals: 1 },
  'bme680_indoor.pressure':  { label: 'Luftdruck', unit: 'hPa', decimals: 0 },
  'bme680_indoor.gas':       { label: 'Gaswiderstand', unit: 'Ω', decimals: 0 },
  'bme680_indoor.vpd':       { label: 'VPD', unit: 'kPa', decimals: 2, statusKey: 'vpd_status' },
  'ccs811.co2':              { label: 'CO2', unit: 'ppm', decimals: 0 },
  'ccs811.tvoc':             { label: 'TVOC', unit: 'ppb', decimals: 0 },
  'bh1750.lux':              { label: 'Licht', unit: 'lux', decimals: 0 },
  'moisture1.pct':           { label: 'Bodenfeuchte 1', unit: '%', decimals: 0, statusKey: 'moisture_status' },
  'moisture2.pct':           { label: 'Bodenfeuchte 2', unit: '%', decimals: 0, statusKey: 'moisture_status' },
};
const STATUS_BADGE_CLASS = { optimal: 'badge-good', warning: 'badge-warning', critical: 'badge-critical' };
const STATUS_LABEL = { optimal: 'Optimal', warning: 'Grenzwertig', critical: 'Kritisch' };

function moistureStatus(pct) {
  if (pct >= 40 && pct <= 60) return 'optimal';
  if (pct >= 20 && pct <= 80) return 'warning';
  return 'critical';
}

let latestSensorData = null;
let chartInstances = {};
let historyBuffers = {};
const MAX_HISTORY_POINTS = 100;

function flattenSensorField(sensors, dottedKey) {
  const [sensorId, field] = dottedKey.split('.');
  const s = sensors[sensorId];
  return s ? s[field] : undefined;
}

function renderStatTiles(payload) {
  const container = document.getElementById('statTiles');
  container.innerHTML = '';
  for (const key of Object.keys(SENSOR_FIELD_DEFS)) {
    const def = SENSOR_FIELD_DEFS[key];
    const raw = flattenSensorField(payload.sensors, key);
    const tile = document.createElement('div');
    tile.className = 'stat-tile';
    let badgeHtml = '';
    if (raw !== undefined && def.statusKey) {
      const statusValue = def.statusKey === 'moisture_status'
        ? moistureStatus(raw)
        : flattenSensorField(payload.sensors, key.split('.')[0] + '.' + def.statusKey);
      const cls = STATUS_BADGE_CLASS[statusValue] || 'badge-muted';
      const label = STATUS_LABEL[statusValue] || statusValue;
      badgeHtml = `<div class="badge ${cls}">${escapeHtml(label)}</div>`;
    }
    const displayValue = (raw === undefined || raw === null) ? '–' : Number(raw).toFixed(def.decimals);
    tile.innerHTML = `
      <div class="label">${escapeHtml(def.label)}</div>
      <div class="value">${displayValue}<span class="unit"> ${escapeHtml(def.unit)}</span></div>
      ${badgeHtml}
    `;
    container.appendChild(tile);
  }
}

const CHART_DEFS = [
  { key: 'bme680_indoor.temp', title: 'Temperatur (°C)', color: 0 },
  { key: 'bme680_indoor.humidity', title: 'Luftfeuchte (%)', color: 4 },
  { key: 'bme680_indoor.vpd', title: 'VPD (kPa)', color: 5 },
  { key: 'ccs811.co2', title: 'CO2 (ppm)', color: 1 },
  { key: 'ccs811.tvoc', title: 'TVOC (ppb)', color: 3 },
  { key: 'bh1750.lux', title: 'Licht (lux)', color: 6 },
];

function buildSingleSeriesChart(canvasId, colorIdx) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  const color = seriesColor(colorIdx);
  return new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [{ data: [], borderColor: color, backgroundColor: color + '1a', borderWidth: 2, pointRadius: 0, fill: true, tension: 0.25 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        zoom: { pan: { enabled: true, mode: 'x' }, zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' } },
      },
      scales: {
        x: { grid: { color: cssVar('--gridline') }, ticks: { color: cssVar('--text-muted'), maxTicksLimit: 6 } },
        y: { grid: { color: cssVar('--gridline') }, ticks: { color: cssVar('--text-muted') } },
      },
    },
  });
}

function buildMoistureChart() {
  const ctx = document.getElementById('chart-moisture').getContext('2d');
  return new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        { label: 'Sensor 1', data: [], borderColor: seriesColor(0), borderWidth: 2, pointRadius: 0, tension: 0.25 },
        { label: 'Sensor 2', data: [], borderColor: seriesColor(2), borderWidth: 2, pointRadius: 0, tension: 0.25 },
      ],
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display: true, labels: { color: cssVar('--text-secondary'), boxWidth: 12 } },
        zoom: { pan: { enabled: true, mode: 'x' }, zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' } },
      },
      scales: {
        x: { grid: { color: cssVar('--gridline') }, ticks: { color: cssVar('--text-muted'), maxTicksLimit: 6 } },
        y: { grid: { color: cssVar('--gridline') }, ticks: { color: cssVar('--text-muted') }, min: 0, max: 100 },
      },
    },
  });
}

function initCharts() {
  const grid = document.getElementById('chartGrid');
  grid.innerHTML = '';
  for (const def of CHART_DEFS) {
    const box = document.createElement('div');
    box.innerHTML = `<div class="chart-title">${escapeHtml(def.title)}</div><div class="chart-box"><canvas id="chart-${def.key}"></canvas></div>`;
    grid.appendChild(box);
  }
  const moistureBox = document.createElement('div');
  moistureBox.innerHTML = `<div class="chart-title">Bodenfeuchte (%)</div><div class="chart-box"><canvas id="chart-moisture"></canvas></div>`;
  grid.appendChild(moistureBox);

  for (const def of CHART_DEFS) {
    chartInstances[def.key] = buildSingleSeriesChart('chart-' + def.key, def.color);
  }
  chartInstances['moisture'] = buildMoistureChart();
}

function pushHistoryPoint(payload) {
  const label = payload.timestamp ? payload.timestamp.split('-')[1] || payload.timestamp : new Date().toLocaleTimeString();
  for (const def of CHART_DEFS) {
    const chart = chartInstances[def.key];
    const value = flattenSensorField(payload.sensors, def.key);
    chart.data.labels.push(label);
    chart.data.datasets[0].data.push(value);
    if (chart.data.labels.length > MAX_HISTORY_POINTS) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
    chart.update('none');
  }
  const mChart = chartInstances['moisture'];
  mChart.data.labels.push(label);
  mChart.data.datasets[0].data.push(flattenSensorField(payload.sensors, 'moisture1.pct'));
  mChart.data.datasets[1].data.push(flattenSensorField(payload.sensors, 'moisture2.pct'));
  if (mChart.data.labels.length > MAX_HISTORY_POINTS) {
    mChart.data.labels.shift(); mChart.data.datasets[0].data.shift(); mChart.data.datasets[1].data.shift();
  }
  mChart.update('none');
}

// ---- Actuators ----
let currentActuators = [];

async function loadActuators() {
  currentActuators = await api('/api/actuators');
  renderActuatorCards();
  renderActionRowOptions();
}

function renderActuatorCards() {
  const container = document.getElementById('actuatorCards');
  container.innerHTML = '';
  for (const a of currentActuators) {
    const card = document.createElement('div');
    card.className = 'actuator-card';
    const valueId = `actuator-value-${a.id}`;
    card.innerHTML = `
      <div class="value-row"><span>${escapeHtml(a.label)}</span><span class="value" id="${valueId}">${a.value}%</span></div>
      <input type="range" min="${a.min_value}" max="${a.max_value}" step="5" value="${a.value}"
             oninput="document.getElementById('${valueId}').textContent = this.value + '%'"
             onchange="setActuator('${a.id}', this.value)">
      <div class="btn-row">
        <button class="small" onclick="setActuator('${a.id}', 0)">Aus</button>
        <button class="small" onclick="setActuator('${a.id}', 50)">50%</button>
        <button class="small" onclick="setActuator('${a.id}', 100)">100%</button>
      </div>
    `;
    container.appendChild(card);
  }
}

async function setActuator(id, value) {
  const result = await api(`/api/actuators/set?${encodeURIComponent(id)}=${encodeURIComponent(value)}`);
  if (result.status === 'success') {
    showToast(`${id}: ${result.values[id]}%`);
    loadActuators();
  } else {
    showToast('Fehler: ' + result.message);
  }
}

// ---- Schedule ----
let selectedWeekdays = [0, 1, 2, 3, 4, 5, 6];
const WEEKDAY_NAMES = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

function renderWeekdayPicker() {
  const el = document.getElementById('weekdayPicker');
  el.innerHTML = WEEKDAY_NAMES.map((name, i) =>
    `<button class="${selectedWeekdays.includes(i) ? 'active' : ''}" onclick="toggleWeekday(${i})">${name}</button>`
  ).join('');
}
function toggleWeekday(i) {
  const idx = selectedWeekdays.indexOf(i);
  if (idx === -1) selectedWeekdays.push(i); else selectedWeekdays.splice(idx, 1);
  renderWeekdayPicker();
}
function selectWeekdays(days) { selectedWeekdays = days; renderWeekdayPicker(); }

function renderActionRowOptions() {
  document.querySelectorAll('.action-row select').forEach(sel => {
    const current = sel.value;
    sel.innerHTML = currentActuators.map(a => `<option value="${a.id}">${escapeHtml(a.label)}</option>`).join('');
    if (current) sel.value = current;
  });
}
function addActionRow() {
  const container = document.getElementById('ruleActions');
  const row = document.createElement('div');
  row.className = 'action-row';
  row.innerHTML = `
    <select>${currentActuators.map(a => `<option value="${a.id}">${escapeHtml(a.label)}</option>`).join('')}</select>
    <input type="number" min="0" max="100" value="50">
    <button class="small" onclick="this.parentElement.remove()">×</button>
  `;
  container.appendChild(row);
}

async function submitRule() {
  const name = document.getElementById('ruleName').value.trim();
  const start = document.getElementById('ruleStart').value.split(':');
  const end = document.getElementById('ruleEnd').value.split(':');
  const actions = Array.from(document.querySelectorAll('#ruleActions .action-row')).map(row => ({
    actuator_id: row.querySelector('select').value,
    value: Number(row.querySelector('input').value),
  }));
  if (!name || actions.length === 0) { showToast('Name und mindestens eine Aktion erforderlich'); return; }

  const params = new URLSearchParams({
    name, start_hour: start[0], start_minute: start[1] || '0',
    end_hour: end[0], end_minute: end[1] || '0',
    weekdays: selectedWeekdays.join(','),
    actions: JSON.stringify(actions),
  });
  const result = await api('/api/schedule/add?' + params.toString());
  if (result.status === 'success') { showToast('Regel gespeichert'); loadSchedule(); }
  else showToast('Fehler: ' + result.message);
}

async function loadSchedule() {
  const data = await api('/api/schedule');
  const container = document.getElementById('scheduleList');
  if (!data.schedule.length) { container.innerHTML = '<div class="meta">Keine Regeln vorhanden.</div>'; return; }
  container.innerHTML = data.schedule.map((rule, i) => {
    const time = `${String(rule.start_hour).padStart(2,'0')}:${String(rule.start_minute).padStart(2,'0')} - ${String(rule.end_hour).padStart(2,'0')}:${String(rule.end_minute).padStart(2,'0')}`;
    const days = (rule.weekdays || []).map(d => WEEKDAY_NAMES[d]).join(', ');
    const actionsText = (rule.actions || []).map(a => `${escapeHtml(a.actuator_id)}: ${a.value}%`).join(', ');
    return `
      <div class="schedule-item ${rule.enabled ? '' : 'disabled'}">
        <div>
          <div><strong>${escapeHtml(rule.name)}</strong></div>
          <div class="meta">${time} · ${escapeHtml(days)} · ${actionsText}</div>
        </div>
        <div class="btn-row">
          <button class="small" onclick="toggleRule(${i})">${rule.enabled ? 'Pause' : 'Start'}</button>
          <button class="small danger" onclick="deleteRule(${i})">Loeschen</button>
        </div>
      </div>`;
  }).join('');
}
async function toggleRule(id) {
  const r = await api(`/api/schedule/toggle?id=${id}`);
  if (r.status === 'success') loadSchedule(); else showToast(r.message);
}
async function deleteRule(id) {
  if (!confirm('Regel wirklich loeschen?')) return;
  const r = await api(`/api/schedule/delete?id=${id}`);
  if (r.status === 'success') loadSchedule(); else showToast(r.message);
}
async function clearAllSchedules() {
  if (!confirm('Wirklich ALLE Regeln loeschen?')) return;
  await api('/api/schedule/clear');
  loadSchedule();
}

// ---- System status ----
async function loadStatus() {
  const s = await api('/api/status');
  const table = document.getElementById('statusTable');
  table.innerHTML = `
    <tr><td>Speicher frei</td><td>${(s.memory.free/1024).toFixed(0)} KB (${(100-s.memory.usage_percent).toFixed(0)}%)</td></tr>
    <tr><td>WLAN</td><td>${escapeHtml(s.wifi.signal_quality)} (${s.wifi.rssi} dBm)</td></tr>
    <tr><td>IP-Adresse</td><td>${escapeHtml(s.wifi.ip_address)}</td></tr>
    <tr><td>Laufzeit</td><td>${escapeHtml(s.system.uptime_formatted)}</td></tr>
    <tr><td>CSV-Zeilen</td><td>${s.data.csv_lines} (${(s.data.csv_size_bytes/1024).toFixed(0)} KB)</td></tr>
  `;
}

function downloadCsv() { window.location.href = '/api/csv/download'; }
async function resetDevice() {
  if (!confirm('ESP32 wirklich neu starten?')) return;
  await fetch('/reset');
  showToast('Neustart...');
}

// ---- OTA ----
async function checkOta() {
  const r = await api('/api/ota/status');
  if (r.status !== 'success') { showToast('Fehler: ' + r.message); return; }
  document.getElementById('otaVersion').textContent = `${r.current}${r.available ? ' -> ' + r.latest + ' verfuegbar' : ' (aktuell)'}`;
  document.getElementById('otaApplyBtn').style.display = r.available ? 'inline-block' : 'none';
}
async function applyOta() {
  if (!confirm('Firmware jetzt aktualisieren? Das Geraet startet danach neu.')) return;
  showToast('Update laeuft...');
  const r = await api('/api/ota/apply');
  if (r.status === 'success') showToast('Update erfolgreich, Neustart...');
  else showToast('Fehler: ' + r.message);
}

// ---- Main polling loop ----
const POLL_INTERVAL_MS = 15000; // muss zu CONFIG.SENSOR_POLL_INTERVAL passen
let pollTimer = null;
async function poll() {
  try {
    latestSensorData = await api('/api/sensordata');
    renderStatTiles(latestSensorData);
    pushHistoryPoint(latestSensorData);
    document.getElementById('connDot').classList.add('online');
    document.getElementById('connText').textContent = 'Verbunden · ' + latestSensorData.timestamp;
  } catch (e) {
    document.getElementById('connDot').classList.remove('online');
    document.getElementById('connText').textContent = 'Verbindung getrennt';
  }
}

async function init() {
  initCharts();
  renderWeekdayPicker();
  await loadActuators();
  addActionRow();
  await loadSchedule();
  await loadStatus();
  await checkOta();
  await poll();
  pollTimer = setInterval(poll, POLL_INTERVAL_MS);
  setInterval(loadStatus, 60000);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) { clearInterval(pollTimer); }
  else { poll(); pollTimer = setInterval(poll, POLL_INTERVAL_MS); }
});

init();
</script>
